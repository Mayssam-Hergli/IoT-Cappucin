<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBER login</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#14161a; color:#eef0f3;
         font-family: "Segoe UI", system-ui, sans-serif; }
  form { background:#1f232a; padding:32px; border-radius:14px; width:min(340px, calc(100vw - 32px)); box-sizing:border-box; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:2px; color:#ff6b35; }
  p.sub { margin:0 0 20px; color:#9aa3ad; font-size:14px; }
  label { display:block; font-size:13px; color:#9aa3ad; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid #39404a;
          background:#14161a; color:#eef0f3; font-size:16px; }
  button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:#ff6b35; color:#fff;
           font-size:16px; font-weight:600; cursor:pointer; }
  .err { margin-top:14px; color:#ff5a5a; font-size:14px; }
</style>
</head>
<body>
<form method="post" autocomplete="off">
  <h1>EMBER</h1>
  <p class="sub">Fire &amp; gas-leak detection. Authorized staff only.</p>
  <label for="u">Username</label><input id="u" name="username" required autofocus>
  <label for="p">Password</label><input id="p" name="password" type="password" required>
  <button type="submit">Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
